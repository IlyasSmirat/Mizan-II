<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan II</title>
    <link rel="stylesheet" href="mizan-II.css">
    <script type="module" src="mizan-II.js"></script>
</head>
<body>
    <section id="catalogue">
        <h2>Catalogue des articles</h2>
    </section>
    <div class="cont">
        <input id="recherche" type="text" placeholder="Chercher un article :">
        <div id="filter">
            <div id="filtreDiv">
                <p>Filtrer par :</p>
                <select id="filtre-status">
                    <option value="tous">Tous les articles</option>
                    <option value="Disponible">Disponible</option>
                    <option value="Réservé">Réserver</option>
                </select>
            </div>
            <div id="triDiv">
                <p>Trier par :</p>
                <select id="tri">
                    <option value="title">Titre</option>
                    <option value="prix">Prix</option>
                    <option value="date">Date</option>
                </select>
            </div>
        </div>
        <div id="arc">
            <p>Ajouter un produit :</p>
            <form id="form-article">
                <input type="text" id="titre" placeholder="Ex : Titre de l'article">
                <p id="titreErreur" class="hidden"></p>
                <textarea id="description" placeholder="Description de l'article"></textarea>
                <p id="descriptionErreur" class="hidden"></p>
                <input type="number" id="prix" placeholder="Prix en MAD">
                <p id="prixErreur" class="hidden"></p>
                <button type="submit" id="button-ajouter">Ajouter l'article</button>
            </form>
            <p id="form-message" class="hidden"></p>
        </div>
        <div id="liste-articles"></div>
    </div>
</body>
</html>
